name: Publish Level Bundles

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Vault Level to publish"
        required: true
        default: "1"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          repository: theghost024jr-sys/Threshold-Studio-Website
          path: website

      - name: Checkout Assets
        uses: actions/checkout@v4
        with:
          repository: theghost024jr-sys/Threshold-Studio-Assets
          path: assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -r frontend/tools/requirements.txt || true

      - name: Build Level Archives
        run: |
          python frontend/tools/level_builder.py \
            --manifest-dir frontend/vault-manifest \
            --output-dir frontend/temp-vault

      - name: Publish Level Bundles
        run: |
          python frontend/tools/publish_node_bundles.py \
            --archive frontend/temp-vault/level${{ github.event.inputs.level }}.json \
            --asset-root assets \
            --branch "level-${{ github.event.inputs.level }}"

