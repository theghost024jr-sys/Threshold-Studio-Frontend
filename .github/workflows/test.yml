name: Validate Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-validation:
    name: Threshold schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate traceability schema and mutations
        run: npm run test:traceability

  test:
    name: Full test suite
    needs: schema-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_build_vault_data.py tools/test_threshold_paths.py

      - name: Run full test suite
        run: npm test

  build:
    name: Build publication artifact
    needs:
      - schema-validation
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Portal dependencies
        run: npm ci --prefix website/portal

      - name: Validate frontend build
        run: npm run build:ci

      - name: Upload Cloudflare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: website/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3