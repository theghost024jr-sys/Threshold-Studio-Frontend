<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threshold Engine - Mechanics</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/hub-interaction.css?v=20260807d" />
</head>
<body class="page-hub hub-page" data-hub-state="idle" data-mode="schematic" data-threshold-spoke="engine">
  <link rel="stylesheet" href="styles/spoke-tabs.css" />
  <div class="hub-overlay" aria-hidden="true"></div>
  <div class="hub-connection-layer">
    <div id="space-layer" class="space-layer" aria-hidden="true"></div>
    <span class="hub-sky" aria-hidden="true"></span>
    <div class="diamond-field" aria-hidden="true">
      <span class="diamond-shape diamond-outer"></span>
      <span class="diamond-shape diamond-inner"></span>
      <span class="diamond-glyph-band"></span>
      <span class="diamond-corner diamond-corner-ne"></span>
      <span class="diamond-corner diamond-corner-se"></span>
      <span class="diamond-corner diamond-corner-sw"></span>
      <span class="diamond-corner diamond-corner-nw"></span>
    </div>
    <button class="hub-strand hub-strand-wake" type="button" data-hub-target="wake" aria-label="Begin at The Wake"></button>
    <button class="hub-strand hub-strand-fold" type="button" data-hub-target="fold" aria-label="Begin at The Fold"></button>
    <button class="hub-strand hub-strand-spire" type="button" data-hub-target="spire" aria-label="Begin at The Spire"></button>
    <img class="hub-seed-logo" src="assets/logo/threshold-logo.svg" alt="" loading="eager" decoding="async" />
  </div>

  <main class="hub-shell" aria-label="Threshold Engine Schematic">
    <aside class="engine-telemetry" aria-label="Live engine telemetry">
      <h2>Engine Telemetry</h2>
      <dl>
        <div><dt>Matrix</dt><dd id="telemetry-matrix">idle</dd></div>
        <div><dt>Wave A</dt><dd id="telemetry-wave-a">0.0000</dd></div>
        <div><dt>Wave B</dt><dd id="telemetry-wave-b">0.0000</dd></div>
        <div><dt>Path</dt><dd id="telemetry-path">none</dd></div>
        <div><dt>Hub Energy</dt><dd id="telemetry-energy">0.0000</dd></div>
      </dl>
    </aside>

    <aside class="engine-calibration" aria-label="Engine calibration controls">
      <h2>Calibration</h2>
      <div class="cal-row">
        <label for="cal-inner-speed">Inner Speed</label>
        <input id="cal-inner-speed" type="range" min="0.20" max="1.60" step="0.01" />
        <output id="cal-out-inner-speed">0.58</output>
      </div>
      <div class="cal-row">
        <label for="cal-inner-volume">Inner Volume</label>
        <input id="cal-inner-volume" type="range" min="0.20" max="1.80" step="0.01" />
        <output id="cal-out-inner-volume">1.00</output>
      </div>
      <div class="cal-row">
        <label for="cal-outer-speed">Outer Speed</label>
        <input id="cal-outer-speed" type="range" min="0.40" max="2.40" step="0.01" />
        <output id="cal-out-outer-speed">1.32</output>
      </div>
      <div class="cal-row">
        <label for="cal-outer-volume">Outer Volume</label>
        <input id="cal-outer-volume" type="range" min="0.15" max="1.40" step="0.01" />
        <output id="cal-out-outer-volume">0.70</output>
      </div>
      <div class="cal-row">
        <label for="cal-damping">Damping</label>
        <input id="cal-damping" type="range" min="0.04" max="0.40" step="0.01" />
        <output id="cal-out-damping">0.20</output>
      </div>
      <div class="cal-row">
        <label for="cal-pull-cap">Pull Cap px/s</label>
        <input id="cal-pull-cap" type="range" min="50" max="420" step="5" />
        <output id="cal-out-pull-cap">160</output>
      </div>
      <div class="cal-row">
        <label for="cal-scale-cap">Scale Cap /s</label>
        <input id="cal-scale-cap" type="range" min="0.20" max="2.20" step="0.01" />
        <output id="cal-out-scale-cap">0.90</output>
      </div>
      <div class="cal-row">
        <label for="cal-retire-start">Retire Start ms</label>
        <input id="cal-retire-start" type="range" min="400" max="6000" step="50" />
        <output id="cal-out-retire-start">2200</output>
      </div>
      <div class="cal-row">
        <label for="cal-retire-end">Retire End ms</label>
        <input id="cal-retire-end" type="range" min="700" max="8000" step="50" />
        <output id="cal-out-retire-end">4200</output>
      </div>
      <button id="cal-reset" class="cal-reset" type="button">Reset Calibration</button>
    </aside>
    <div class="mobius-frame" aria-hidden="true">
      <span class="mobius-loop mobius-loop-a"></span>
      <span class="mobius-loop mobius-loop-b"></span>
      <span class="mobius-knot"></span>
    </div>

    <div class="sunflower-core" aria-hidden="true">
      <span class="sunflower-core-ring"></span>
      <span class="sunflower-core-dot"></span>
    </div>

    <div class="hub-logo-cluster">
      <button class="hub-logo-mark hub-logo-trigger hub-logo-top-left" type="button" data-hub-target="wake" aria-label="Activate The Wake">
        <img src="assets/logo/threshold-logo.svg" alt="" loading="eager" decoding="async" />
      </button>
      <button class="hub-logo-mark hub-logo-trigger hub-logo-top-right" type="button" data-hub-target="fold" aria-label="Activate The Fold">
        <img src="assets/logo/threshold-logo.svg" alt="" loading="eager" decoding="async" />
      </button>
      <button class="hub-logo-mark hub-logo-trigger hub-logo-bottom-left" type="button" data-hub-target="spire" aria-label="Activate The Spire">
        <img src="assets/logo/threshold-logo.svg" alt="" loading="eager" decoding="async" />
      </button>
    </div>

    <section class="hub-split" aria-label="Triad hub activation schematic">
      <button id="hub-a" class="hub hub-a" type="button" aria-label="Schematic Hub A" data-hub="wake">
        <span class="hub-ring hub-ring-outer"></span>
        <span class="hub-ring hub-ring-middle"></span>
        <span class="hub-ring hub-ring-inner"></span>
        <span class="hub-core" aria-hidden="true">âœ¦</span>
      </button>

      <button id="hub-b" class="hub hub-b" type="button" aria-label="Schematic Hub B" data-hub="fold">
        <span class="hub-ring hub-ring-outer"></span>
        <span class="hub-ring hub-ring-middle"></span>
        <span class="hub-ring hub-ring-inner"></span>
        <span class="hub-core" aria-hidden="true">â—Œ</span>
      </button>

      <button id="hub-c" class="hub hub-c" type="button" aria-label="Schematic Hub C" data-hub="spire">
        <span class="hub-ring hub-ring-outer"></span>
        <span class="hub-ring hub-ring-middle"></span>
        <span class="hub-ring hub-ring-inner"></span>
        <span class="hub-core" aria-hidden="true">âŸ¡</span>
      </button>
    </section>

    <p id="hub-label-a" class="hub-label" aria-hidden="true">CHANNEL WAKE</p>
    <p id="hub-label-b" class="hub-label" aria-hidden="true">CHANNEL FOLD</p>
    <p id="hub-label-c" class="hub-label" aria-hidden="true">CHANNEL SPIRE</p>

    <div id="hub-live" class="sr-only" role="status" aria-live="polite"></div>
  </main>

  <div id="glyph-layer" class="glyph-layer" aria-hidden="true"></div>

  <script type="module" src="scripts/hub-engine.js?v=20260807h"></script>

  <template id="glyph-template">
    <span class="spawn-glyph">âœ§</span>
  </template>

  <script>
    window.__thresholdHubGlyphSet = ["âœ¦", "âœ§", "âœ¶", "âœ¹", "âœº", "âœ·", "â‹", "âˆ", "âœµ", "âŠ¹", "âœ´", "âŸ¡", "â—ˆ", "â—Œ", "â—", "â˜‰", "â˜½", "â˜¿", "âŒ˜", "âŒ–", "âŒ‘", "âŸ", "âŸ¢", "â—Š"];
  </script>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

  </style>
  <a class="engine-architecture-link" href="index.html" aria-label="Open hub entry">Hub Entry</a>
  <style>
    .engine-architecture-link {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10000;
      padding: 0.36rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(210, 228, 255, 0.5);
      background: rgba(10, 16, 30, 0.78);
      color: rgba(232, 242, 255, 0.96);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.64rem;
      backdrop-filter: blur(4px);
    }
    .engine-architecture-link:hover,
    .engine-architecture-link:focus-visible {
      background: rgba(216, 233, 255, 0.95);
      color: #101524;
      outline: none;
    }
  </style>
  <script src="scripts/node-runtime.js" data-manifest="config/spokes.json"></script>
  <script src="scripts/spoke-tabs.js"></script>
</body>
</html>
