<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Voice Portals</title>
  <link rel="stylesheet" href="./voice-portals.css">
</head>
<body>
  <canvas id="living-wheel-layer" aria-hidden="true"></canvas>
  <main class="scene">
    <header class="scene-header">
      <p class="kicker">Threshold Mechanic</p>
      <h1>The Containers Are Input Portals</h1>
      <p class="subtitle">
        Voice fragments open branches. Search touches every markdown node, tag, link, and echo path.
      </p>
    </header>

    <section class="portal-grid" aria-label="Voice portal containers">
      <article class="portal" id="portal-arrival" data-kind="five-words">
        <div class="portal-head">
          <h2>Arrival Portal</h2>
          <button class="glyph-rotate" type="button" data-portal="arrival" aria-label="Rotate arrival branch">
            Rotate Glyph
          </button>
        </div>

        <p class="portal-prompt">Leave five words.</p>
        <p class="portal-current">Current branch: <span class="portal-node" id="arrival-node">loading...</span></p>

        <form class="voice-form" data-portal="arrival">
          <label for="arrival-input">Voice fragment</label>
          <input id="arrival-input" name="query" type="text" autocomplete="off" placeholder="fearless drift echo memory soil" required>
          <button type="submit">Open Branches</button>
        </form>

        <p class="validation" id="arrival-validation" aria-live="polite"></p>
        <div class="results" id="arrival-results" aria-live="polite"></div>
      </article>

      <article class="portal" id="portal-return" data-kind="sentence">
        <div class="portal-head">
          <h2>Return Portal</h2>
          <button class="glyph-rotate" type="button" data-portal="return" aria-label="Rotate return branch">
            Rotate Glyph
          </button>
        </div>

        <p class="portal-prompt">Make a sentence.</p>
        <p class="portal-current">Current branch: <span class="portal-node" id="return-node">loading...</span></p>

        <form class="voice-form" data-portal="return">
          <label for="return-input">Voice sentence</label>
          <input id="return-input" name="query" type="text" autocomplete="off" placeholder="The echo returned softer than it left." required>
          <button type="submit">Open Branches</button>
        </form>

        <p class="validation" id="return-validation" aria-live="polite"></p>
        <div class="results" id="return-results" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script type="module" src="./voice-portals.js"></script>
</body>
</html>
