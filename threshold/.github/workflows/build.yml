name: Build Threshold Module

on:
  workflow_dispatch:
    inputs:
      target:
        description: Layer to publish
        required: true
        type: choice
        options: [core, branch]
      branch:
        description: Drift branch; ignored for core
        required: false
        type: choice
        options: [mythology, glyphs, dialogues, vault]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  core:
    if: inputs.target == 'core'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python builder/build_core.py
      - run: python builder/validate_core.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/core
      - id: deployment
        uses: actions/deploy-pages@v4

  branch:
    if: inputs.target == 'branch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_NODE_BUCKET }}
      NODE_BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Require one branch
        run: test -n "$NODE_BRANCH"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.NODE_SOURCE_REPOSITORY }}
          token: ${{ secrets.NODE_SOURCE_TOKEN }}
          path: .node-source
      - name: Mount only selected private source
        run: cp -a ".node-source/branches/${NODE_BRANCH}/." "branches/${NODE_BRANCH}/src/"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python builder/build_branch.py "$NODE_BRANCH"
      - run: python builder/validate_branch.py "$NODE_BRANCH"
      - run: python -m pip install --disable-pip-version-check awscli
      - name: Publish only selected branch shell
        run: >-
          aws s3 sync "publish/branches/${NODE_BRANCH}"
          "s3://${R2_BUCKET}/branches/${NODE_BRANCH}"
          --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          --delete
          --cache-control "private, no-store"