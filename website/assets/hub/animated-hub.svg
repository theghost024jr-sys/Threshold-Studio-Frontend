<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <style>
    #hub-engine-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: hub-core-pulse 3s ease-in-out infinite;
    }

    #hub-cycle-ring {
      transform-origin: 256px 256px;
      animation: hub-cycle-rotate 4s linear infinite;
    }

    #hub-biome-ring {
      transform-origin: 256px 256px;
      animation: hub-biome-drift 16s linear infinite reverse;
    }

    #hub-signal-halo {
      animation: hub-halo-flicker 2.4s ease-in-out infinite;
    }

    @keyframes hub-core-pulse {
      0%, 100% { transform: scale(0.96); opacity: 0.88; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    @keyframes hub-cycle-rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes hub-biome-drift {
      to { transform: rotate(360deg); }
    }

    @keyframes hub-halo-flicker {
      0%, 100% { opacity: 0.08; }
      45% { opacity: 0.18; }
      55% { opacity: 0.11; }
      70% { opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      #hub-engine-core,
      #hub-cycle-ring,
      #hub-biome-ring,
      #hub-signal-halo {
        animation: none;
      }
    }
  </style>

  <circle id="hub-engine-core" cx="256" cy="256" r="60" fill="#222222" />

  <g id="hub-cycle-ring">
    <path d="M256 116 A140 140 0 0 1 396 256" stroke="#AAAAAA" stroke-width="12" fill="none" />
    <path d="M396 256 A140 140 0 0 1 256 396" stroke="#DDDDDD" stroke-width="12" fill="none" />
    <path d="M256 396 A140 140 0 0 1 256 116" stroke="#FFFFFF" stroke-width="12" fill="none" />
  </g>

  <g id="hub-biome-ring">
    <path d="M256 96 A160 160 0 0 1 330 116" stroke="#F4D03F" stroke-width="16" fill="none" />
    <path d="M330 116 A160 160 0 0 1 396 180" stroke="#E67E22" stroke-width="16" fill="none" />
    <path d="M396 180 A160 160 0 0 1 416 256" stroke="#A67C52" stroke-width="16" fill="none" />
    <path d="M416 256 A160 160 0 0 1 396 332" stroke="#556B2F" stroke-width="16" fill="none" />
    <path d="M396 332 A160 160 0 0 1 330 396" stroke="#C0392B" stroke-width="16" fill="none" />
    <path d="M330 396 A160 160 0 0 1 256 416" stroke="#5D4037" stroke-width="16" fill="none" />
    <path d="M256 416 A160 160 0 0 1 256 96" stroke="#000000" stroke-width="16" fill="none" />
  </g>

  <circle id="hub-chamber-ring" cx="256" cy="256" r="200" stroke="#444444" stroke-width="24" fill="none" />
  <circle id="hub-signal-halo" cx="256" cy="256" r="240" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.10" />
</svg>
