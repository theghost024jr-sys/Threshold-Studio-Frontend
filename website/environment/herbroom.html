<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herb Room</title>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #10150f;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      --east-reveal: 0;
      --east-shift: 38%;
      --water-shift: 32%;
      --growth-shift: 24%;
      --cue-reveal: 0;
      --interior-brightness: 1;
      --interior-saturation: 1;
    }

    body > img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(var(--interior-brightness)) saturate(var(--interior-saturation));
    }

    .chamber-controls a {
      position: absolute;
      z-index: 1;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(8, 12, 8, 0.72);
      color: #fff;
      font: 600 0.85rem/1 sans-serif;
      text-decoration: none;
    }

    .exit-south {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .east-threshold {
      position: absolute;
      inset: 0 0 0 auto;
      width: min(48vw, 680px);
      overflow: hidden;
      opacity: var(--east-reveal);
      pointer-events: none;
    }

    .east-threshold::before {
      position: absolute;
      inset: -8% -18% -8% 4%;
      border-radius: 52% 0 0 48%;
      background:
        radial-gradient(ellipse at 88% 18%, rgba(187, 220, 234, 0.98) 0 20%, rgba(127, 176, 189, 0.76) 46%, transparent 72%),
        linear-gradient(145deg, rgba(239, 244, 209, 0.08), rgba(151, 201, 177, 0.82));
      box-shadow: inset 40px 0 70px rgba(224, 241, 196, 0.18), -18px 0 55px rgba(222, 239, 185, 0.24);
      content: "";
      transform: translateX(var(--east-shift));
    }

    .east-threshold__water {
      position: absolute;
      right: -4%;
      bottom: 0;
      width: 92%;
      height: 34%;
      background:
        repeating-linear-gradient(174deg, rgba(230, 246, 232, 0.38) 0 2px, transparent 2px 16px),
        linear-gradient(180deg, rgba(118, 176, 170, 0.1), rgba(56, 112, 110, 0.74));
      clip-path: ellipse(76% 66% at 74% 100%);
      transform: translateY(var(--water-shift));
    }

    .east-threshold__growth {
      position: absolute;
      inset: 36% 0 0 18%;
      background:
        radial-gradient(ellipse at 92% 42%, rgba(78, 132, 68, 0.94) 0 9%, transparent 10%),
        radial-gradient(ellipse at 76% 55%, rgba(99, 151, 77, 0.9) 0 12%, transparent 13%),
        radial-gradient(ellipse at 88% 72%, rgba(49, 104, 57, 0.92) 0 15%, transparent 16%),
        radial-gradient(ellipse at 60% 85%, rgba(92, 145, 73, 0.84) 0 12%, transparent 13%);
      transform: translateX(var(--growth-shift));
    }

    .east-threshold__cue {
      position: absolute;
      top: 50%;
      right: 34px;
      z-index: 2;
      margin: 0;
      color: rgba(255, 255, 244, 0.96);
      font: 500 1rem/1.2 Georgia, serif;
      letter-spacing: 0.08em;
      opacity: var(--cue-reveal);
      pointer-events: none;
      text-decoration: none;
      text-shadow: 0 2px 18px rgba(18, 35, 24, 0.9);
      transform: translateY(-50%);
    }

    .east-threshold__cue.is-available {
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: no-preference) {
      body > img,
      .east-threshold,
      .east-threshold::before,
      .east-threshold__water,
      .east-threshold__growth {
        transition: filter 180ms ease-out, opacity 180ms ease-out, transform 180ms ease-out;
      }
    }
  </style>
</head>
<body>
  <img src="/assets/weather/weather-038-herbroom.png" alt="Herb Room" />
  <div class="east-threshold" aria-hidden="true">
    <div class="east-threshold__water"></div>
    <div class="east-threshold__growth"></div>
    <a class="east-threshold__cue" href="/environment/basin.html" tabindex="-1">Step through.</a>
  </div>
  <script>
    const chamber = document.body;
    const eastThreshold = document.querySelector('.east-threshold');
    const eastCue = document.querySelector('.east-threshold__cue');

    const revealEast = (clientX) => {
      const start = window.innerWidth * 0.52;
      const progress = Math.max(0, Math.min(1, (clientX - start) / (window.innerWidth - start)));
      chamber.style.setProperty('--east-reveal', progress.toFixed(3));
      chamber.style.setProperty('--east-shift', `${((1 - progress) * 38).toFixed(2)}%`);
      chamber.style.setProperty('--water-shift', `${((1 - progress) * 32).toFixed(2)}%`);
      chamber.style.setProperty('--growth-shift', `${((1 - progress) * 24).toFixed(2)}%`);
      chamber.style.setProperty('--cue-reveal', Math.max(0, Math.min(1, (progress - 0.68) * 4)).toFixed(3));
      chamber.style.setProperty('--interior-brightness', (1 - progress * 0.16).toFixed(3));
      chamber.style.setProperty('--interior-saturation', (1 - progress * 0.1).toFixed(3));
      const isAvailable = progress >= 0.9;
      eastThreshold.style.pointerEvents = isAvailable ? 'auto' : 'none';
      eastThreshold.setAttribute('aria-hidden', String(!isAvailable));
      eastCue.classList.toggle('is-available', isAvailable);
      eastCue.tabIndex = isAvailable ? 0 : -1;
    };

    window.addEventListener('pointermove', (event) => revealEast(event.clientX), { passive: true });
    window.addEventListener('pointerleave', () => revealEast(0));
  </script>
</body>
</html>
