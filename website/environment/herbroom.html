    .herb-viewport.is-bottle-broken .garden-sky { background: radial-gradient(ellipse at 68% 18%, rgba(159, 174, 178, .36), transparent 19%), linear-gradient(155deg, #66797c 0%, #687565 39%, #2c4137 100%); }
    .herb-viewport.is-bottle-broken .garden-foliage--near { animation-duration: 1.1s; }
    .herb-viewport.is-bottle-broken .garden-mote { opacity: .05; }
    .herb-viewport.is-watered .herb-dry-plant::before { background: radial-gradient(ellipse, rgba(116, 178, 98, .5), transparent 70%); content: ""; inset: 6%; position: absolute; }
    .herb-viewport.is-seated .room-backdrop { filter: brightness(.92) saturate(.9); transform: scale(1.18) translate3d(calc(var(--room-pan-x) * .06), calc(5% + var(--room-pan-y) * .06), 0); }
    .herb-viewport.is-seated .herb-book::before { opacity: 1; }

    .east-threshold::before { background: radial-gradient(ellipse at 88% 18%, rgba(187,220,234,.98) 0 20%, rgba(127,176,189,.76) 46%, transparent 72%), linear-gradient(145deg, rgba(239,244,209,.08), rgba(151,201,177,.82)); border-radius: 52% 0 0 48%; box-shadow: inset 40px 0 70px rgba(224,241,196,.18), -18px 0 55px rgba(222,239,185,.24); content: ""; inset: -8% -18% -8% 4%; position: absolute; transform: translateX(var(--east-shift)); }

    .east-threshold__cue { color: #fffff4; font: 500 1rem/1.2 Georgia, serif; letter-spacing: .08em; margin: 0; opacity: var(--cue-reveal); pointer-events: none; position: absolute; right: 34px; text-decoration: none; text-shadow: 0 2px 18px rgba(18,35,24,.9); top: 50%; transform: translateY(-50%); z-index: 2; }

    .east-threshold.is-failed .east-threshold__water, .east-threshold.is-failed .east-threshold__growth { opacity: 0; }
    .east-threshold.is-failed .east-threshold__cue { opacity: 0; }

    .chamber-controls, .herb-accessible { display: flex; gap: .75rem; position: absolute; z-index: 8; }
    .chamber-controls { bottom: 1.25rem; left: 1.25rem; }
    .herb-accessible { right: 1.25rem; top: 1.25rem; }
    .chamber-controls a, .herb-accessible button { background: rgba(8,12,8,.72); border: 1px solid rgba(255,255,255,.65); color: #fff; cursor: pointer; font: 600 .72rem/1 sans-serif; letter-spacing: .08em; padding: .7rem .85rem; text-decoration: none; text-transform: uppercase; }

<body>
  <main class="herb-viewport" aria-label="Herb Room interaction chamber">
    <img class="room-backdrop" src="/assets/weather/weather-038-herbroom.png" alt="A herb-filled room with a bright window, table, open book, clear bottle, and wooden chair." width="1024" height="1536" />
    <div class="garden-window" aria-label="Garden observed through the window" role="img">
      <div class="garden-sky"></div><div class="garden-foliage garden-foliage--far"></div><div class="garden-branch"></div><div class="garden-foliage garden-foliage--near"></div><div class="garden-flower"></div><div class="garden-pollinator"></div><div class="garden-mote"></div>
    </div>
    <div class="room-air" aria-hidden="true"></div>
    <div class="drag-bottle" aria-hidden="true"></div>
    <div class="spill-water" aria-hidden="true"></div><div class="broken-glass" aria-hidden="true"></div>
    <div class="room-scene">
      <div class="herb-motion herb-motion--window" aria-hidden="true"></div><div class="herb-motion herb-motion--left" aria-hidden="true"></div><div class="herb-motion herb-motion--right" aria-hidden="true"></div>
      <button class="room-object herb-chair" type="button" aria-label="Sit in the chair"></button>
      <button class="room-object herb-bottle" type="button" aria-label="Pick up the clear bottle"></button>
      <button class="room-object herb-dry-plant" type="button" aria-label="Attend to the lowered herb"></button>
      <button class="room-object herb-book" type="button" aria-label="Attend to the open book"></button>
      <div class="east-threshold" aria-hidden="false"><div class="east-threshold__water"></div><div class="east-threshold__growth"></div><a class="east-threshold__cue" href="/environment/basin.html">Step through.</a></div>
    </div>
    <div class="chamber-controls" aria-label="Chamber exits"><a href="/environment/waterfall.html" class="exit-south">Look South</a></div>
    <button class="book-sit-cue" type="button">Sit</button><button class="book-read-cue" type="button">Read</button>
    <aside class="book-reader" aria-labelledby="book-title" aria-modal="true" role="dialog"><button type="button" data-action="close-book">Close</button><h2 id="book-title">The open page</h2><div class="book-content"></div></aside>
    <p class="herb-status" aria-live="polite"></p>
  </main>
  <script type="module">
    import { recordGardenAttention, recordGardenSeen } from "/scripts/garden-evidence-state.js";

    const chamber = document.body, viewport = document.querySelector('.herb-viewport'), scene = document.querySelector('.room-scene');
    const eastThreshold = document.querySelector('.east-threshold'), eastCue = document.querySelector('.east-threshold__cue');
    const chair = document.querySelector('.herb-chair'), bottle = document.querySelector('.herb-bottle'), plant = document.querySelector('.herb-dry-plant'), book = document.querySelector('.herb-book');
    const reader = document.querySelector('.book-reader'), bookContent = document.querySelector('.book-content'), status = document.querySelector('.herb-status');
    let distance = 0, gardenDistance = 0, gardenFocus = 0, gardenAttentionTimer, panX = 0, panY = 0, panState = null, bottleHeld = false, bottleDragging = false, watered = false, smashed = false, bookReady = false, seated = false, publishedBooks = new Map(), windTimer, gardenWindTimer, roomAudio;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const updateRoom = () => { const priorGardenFocus = gardenFocus; gardenFocus = clamp((panX - 44) / 136, 0, 1); viewport.style.setProperty('--room-distance', distance.toFixed(3)); viewport.style.setProperty('--room-pan-x', `${panX}px`); viewport.style.setProperty('--room-pan-y', `${panY}px`); viewport.style.setProperty('--garden-view', gardenFocus.toFixed(3)); viewport.style.setProperty('--garden-nearness', gardenDistance.toFixed(3)); viewport.classList.toggle('is-seated', seated); viewport.classList.toggle('is-bottle-held', bottleHeld); viewport.classList.toggle('is-bottle-dragging', bottleDragging); viewport.classList.toggle('is-watered', watered); viewport.classList.toggle('is-bottle-broken', smashed); viewport.classList.toggle('is-book-ready', bookReady); viewport.classList.toggle('is-garden-observing', gardenFocus >= .55); if (gardenFocus >= .55 && priorGardenFocus < .55) { beginGardenObservation(); scheduleGardenWind(); } if (gardenFocus < .55 && priorGardenFocus >= .55) endGardenObservation(); };
    function beginGardenObservation() { try { recordGardenSeen(window.localStorage); } catch (error) { console.error('Unable to record the Garden glimpse.', error); return; } window.clearInterval(gardenAttentionTimer); gardenAttentionTimer = window.setInterval(() => { try { recordGardenAttention(window.localStorage); } catch (error) { window.clearInterval(gardenAttentionTimer); console.error('Unable to preserve Garden attention.', error); } }, 1000); }
    function endGardenObservation() { window.clearInterval(gardenAttentionTimer); gardenAttentionTimer = undefined; }
    const revealEast = (clientX) => { const start = innerWidth * .52, progress = clamp((clientX - start) / (innerWidth - start), 0, 1); chamber.style.setProperty('--east-reveal', progress.toFixed(3)); chamber.style.setProperty('--east-shift', `${((1 - progress) * 38).toFixed(2)}%`); chamber.style.setProperty('--water-shift', `${((1 - progress) * 32).toFixed(2)}%`); chamber.style.setProperty('--growth-shift', `${((1 - progress) * 24).toFixed(2)}%`); if (smashed) { chamber.style.setProperty('--cue-reveal', '0'); eastThreshold.classList.add('is-failed'); eastThreshold.style.pointerEvents = 'none'; eastCue.classList.remove('is-available'); return; } chamber.style.setProperty('--cue-reveal', clamp((progress - .68) * 4, 0, 1).toFixed(3)); eastThreshold.classList.remove('is-failed'); eastThreshold.style.pointerEvents = progress >= .9 ? 'auto' : 'none'; eastCue.classList.toggle('is-available', progress >= .9); };
    function selectGardenProjection(vault) { const candidates = vault.documents.filter((note) => { if (!note.publish || note.draft || typeof note.body !== 'string') return false; const isGardenCluster = /^_publish\/housegarden(?:_|\/|\.md)/i.test(note.relativePath || ''); const source = `${note.title || ''} ${note.body}`; return isGardenCluster && /\b(flora|flower|pollinator|butterfly|bee|insect)\b/i.test(source) && /\b(move|motion|drift|sway|wind|appear|emerge|flight|fly|growth)\b/i.test(source); }); const choose = (pattern) => { const matches = candidates.filter((note) => pattern.test(`${note.title} ${note.body}`)); return matches.length ? matches[Math.floor(Math.random() * matches.length)] : undefined; }; const flora = choose(/\b(flora|flower|growth)\b/i); const pollinator = choose(/\b(pollinator|butterfly|bee|insect)\b/i); viewport.classList.toggle('has-garden-flora', Boolean(flora)); viewport.classList.toggle('has-garden-pollinator', Boolean(pollinator)); if (flora) viewport.dataset.gardenFloraSource = flora.id; else delete viewport.dataset.gardenFloraSource; if (pollinator) viewport.dataset.gardenPollinatorSource = pollinator.id; else delete viewport.dataset.gardenPollinatorSource; }
    async function loadPublishedBook() { try { const response = await fetch('/data/threshold-vault.json', { cache: 'no-store' }); if (!response.ok) throw new Error(`Vault response ${response.status}`); const vault = await response.json(); for (const note of vault.documents) if (note.publish && !note.draft && /^index-000[12]$/.test(note.id) && typeof note.body === 'string') publishedBooks.set(note.id, note); selectGardenProjection(vault); } catch (error) { console.error('Unable to load Herb Room book source.', error); publishedBooks.clear(); viewport.classList.remove('has-garden-flora', 'has-garden-pollinator'); } }
    async function enableRoomSound() { const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; if (!roomAudio || roomAudio.state === 'closed') roomAudio = new AudioContext(); if (roomAudio.state !== 'running') { try { await roomAudio.resume(); } catch (error) { console.error('Unable to start Herb Room sound.', error); } } }
    function playRoomCue(frequency, duration, volume, pan = 0) { if (!roomAudio || roomAudio.state !== 'running') return; const tone = roomAudio.createOscillator(), gain = roomAudio.createGain(), panner = roomAudio.createStereoPanner?.(); tone.frequency.value = frequency; tone.type = 'sine'; gain.gain.setValueAtTime(.0001, roomAudio.currentTime); gain.gain.exponentialRampToValueAtTime(volume, roomAudio.currentTime + .025); gain.gain.exponentialRampToValueAtTime(.0001, roomAudio.currentTime + duration); tone.connect(gain); if (panner) { panner.pan.value = pan; gain.connect(panner); panner.connect(roomAudio.destination); } else gain.connect(roomAudio.destination); tone.start(); tone.stop(roomAudio.currentTime + duration + .02); }
    function playGlassBreak() { [183, 571, 1288].forEach((frequency, index) => window.setTimeout(() => playRoomCue(frequency, .14 + index * .04, .035 - index * .006, .12), index * 36)); }
    function playGardenAir() { if (!roomAudio || roomAudio.state !== 'running') return; const length = Math.floor(roomAudio.sampleRate * .85), source = roomAudio.createBufferSource(), buffer = roomAudio.createBuffer(1, length, roomAudio.sampleRate), filter = roomAudio.createBiquadFilter(), gain = roomAudio.createGain(), panner = roomAudio.createStereoPanner?.(); const noise = buffer.getChannelData(0); for (let index = 0; index < length; index += 1) noise[index] = (Math.random() * 2 - 1) * (1 - index / length); source.buffer = buffer; filter.type = 'bandpass'; filter.frequency.value = 860; filter.Q.value = .45; gain.gain.setValueAtTime(.0001, roomAudio.currentTime); gain.gain.exponentialRampToValueAtTime(.028, roomAudio.currentTime + .16); gain.gain.exponentialRampToValueAtTime(.0001, roomAudio.currentTime + .85); source.connect(filter); filter.connect(gain); if (panner) { panner.pan.value = -.62; gain.connect(panner); panner.connect(roomAudio.destination); } else gain.connect(roomAudio.destination); source.start(); }
    function playWindChimes(strength) { const tones = strength === 1 ? [932] : strength === 2 ? [784, 1047] : [698, 932, 1175, 831]; const pan = clamp(-panX / 180, -.55, .55); tones.forEach((tone, index) => window.setTimeout(() => playRoomCue(tone, .34, .018, pan), index * (150 + Math.random() * 170))); }
    function runWind(strength) { viewport.classList.add('is-wind'); if (strength === 1) viewport.classList.add('is-wind-light'); if (strength === 2) viewport.classList.add('is-wind-moderate'); if (strength === 3) viewport.classList.add('is-wind-strong'); if (strength) playWindChimes(strength); window.setTimeout(() => viewport.classList.remove('is-wind', 'is-wind-light', 'is-wind-moderate', 'is-wind-strong'), 1500); if (!bookReady && publishedBooks.size && strength >= 2) { bookReady = true; updateRoom(); playRoomCue(640, .18, .012); status.textContent = 'A page settles across the table.'; } }
    function windEvent() { const strength = smashed ? 1 + Math.floor(Math.random() * 3) : bookReady ? Math.random() < .52 ? 0 : Math.random() < .78 ? 1 : Math.random() < .94 ? 2 : 3 : 2; runWind(strength); windTimer = window.setTimeout(windEvent, smashed ? 2900 + Math.random() * 3600 : 5000 + Math.random() * 6500); }
    function scheduleGardenWind() { window.clearTimeout(gardenWindTimer); gardenWindTimer = window.setTimeout(() => { if (gardenFocus < .55) return; viewport.classList.add('is-garden-gusting'); playGardenAir(); status.textContent = 'Foliage bends beyond the sill; the wind arrives in the room.'; window.setTimeout(() => { viewport.classList.remove('is-garden-gusting'); if (gardenFocus >= .55) runWind(2); }, 500); }, 380); }
    function sit() { void enableRoomSound(); seated = true; updateRoom(); playRoomCue(180, .12, .018); status.textContent = 'The room settles around the chair.'; }
    function getUp() { seated = false; updateRoom(); }
    function renderPublishedBook(markdown) {
      bookContent.replaceChildren();
      for (const line of markdown.split(/\r?\n/)) {
        const text = line.trim();
        if (!text) continue;
        const heading = text.match(/^#{1,3}\s+(.+)$/);
        const element = document.createElement(heading ? 'h3' : 'p');
        element.textContent = (heading ? heading[1] : text).replace(/\[\[([^|\]#]+)(?:\|([^\]]+))?\]\]/g, (_match, target, label) => (label || target).trim());
        bookContent.append(element);
      }
    }
    function openBook() { const bookSource = publishedBooks.get(watered ? 'index-0002' : 'index-0001'); if (!seated || !bookReady || !bookSource) { status.textContent = 'The open pages lift, then settle without a readable mark.'; return; } renderPublishedBook(bookSource.body); reader.classList.add('is-open'); }
    function closeBook() { reader.classList.remove('is-open'); }
    function waterPlant() { if (watered) return; watered = true; bottleHeld = false; bottleDragging = false; viewport.classList.add('is-pouring'); updateRoom(); playRoomCue(250, .24, .025); status.textContent = 'Water darkens the soil and disappears.'; window.setTimeout(() => viewport.classList.remove('is-pouring'), 620); }
    function smashBottle() { if (watered || smashed) return; smashed = true; bottleHeld = false; bottleDragging = false; updateRoom(); revealEast(innerWidth); playGlassBreak(); status.textContent = 'Glass breaks. The room changes.'; }
    function updateHeldBottle(event) { const bounds = viewport.getBoundingClientRect(); viewport.style.setProperty('--bottle-x', `${event.clientX - bounds.left}px`); viewport.style.setProperty('--bottle-y', `${event.clientY - bounds.top}px`); const plantBounds = plant.getBoundingClientRect(); if (event.clientX >= plantBounds.left && event.clientX <= plantBounds.right && event.clientY >= plantBounds.top && event.clientY <= plantBounds.bottom) waterPlant(); }
    chair.addEventListener('click', sit);
    bottle.addEventListener('pointerdown', (event) => { if (event.button !== 0 || watered || smashed) return; event.preventDefault(); event.stopPropagation(); void enableRoomSound(); bottleHeld = true; bottleDragging = true; updateHeldBottle(event); updateRoom(); playRoomCue(420, .1, .012); status.textContent = 'The bottle has a quiet weight in your hand.'; });
    bottle.addEventListener('click', (event) => { if (event.detail !== 0 || watered || smashed) return; void enableRoomSound(); bottleHeld = true; updateRoom(); status.textContent = 'The bottle has a quiet weight in your hand.'; });
    bottle.addEventListener('dblclick', (event) => { event.preventDefault(); void enableRoomSound().then(smashBottle); });
    bottle.addEventListener('keydown', (event) => { if (event.key === 'Enter' && event.shiftKey) { event.preventDefault(); void enableRoomSound().then(smashBottle); } });
    plant.addEventListener('click', () => { if (bottleHeld) waterPlant(); else status.textContent = watered ? 'The soil remains dark and receptive.' : 'The lowered leaves remain still.'; });
    book.addEventListener('pointerenter', () => viewport.classList.add('is-book-attended'));
    book.addEventListener('pointerleave', () => viewport.classList.remove('is-book-attended'));
    book.addEventListener('focus', () => viewport.classList.add('is-book-attended'));
    book.addEventListener('blur', () => viewport.classList.remove('is-book-attended'));
    book.addEventListener('click', () => { if (seated) openBook(); });
    document.querySelector('.book-sit-cue').addEventListener('click', sit); document.querySelector('.book-read-cue').addEventListener('click', openBook); document.querySelector('[data-action="close-book"]').addEventListener('click', closeBook);
    scene.addEventListener('wheel', (event) => { event.preventDefault(); if (event.deltaY < 0 && seated) getUp(); if (gardenFocus >= .55) { gardenDistance = clamp(gardenDistance + Math.sign(event.deltaY) * .08, 0, 1); if (gardenDistance === 1 && event.deltaY > 0) status.textContent = 'The sill holds the Garden at a distance.'; } else distance = clamp(distance + Math.sign(event.deltaY) * .08, 0, 1); updateRoom(); }, { passive: false });
    scene.addEventListener('pointerdown', (event) => { if (event.button !== 0) return; void enableRoomSound(); panState = { x: event.clientX, y: event.clientY, panX, panY, moved: false }; });
    window.addEventListener('pointermove', (event) => { if (bottleDragging) { updateHeldBottle(event); return; } if (!panState) { revealEast(event.clientX); return; } const dx = event.clientX - panState.x, dy = event.clientY - panState.y; if (Math.hypot(dx, dy) < 8 && !panState.moved) return; panState.moved = true; panX = clamp(panState.panX + dx, -180, 180); panY = clamp(panState.panY + dy, -110, 110); viewport.classList.add('is-panning'); updateRoom(); });
    window.addEventListener('pointerup', () => { if (bottleDragging) { bottleDragging = false; if (!watered) bottleHeld = false; updateRoom(); } if (!panState) return; panState = null; viewport.classList.remove('is-panning'); });
    window.addEventListener('keydown', (event) => { if (event.key === 'Escape') { closeBook(); getUp(); } });
    window.addEventListener('pagehide', () => { endGardenObservation(); window.clearTimeout(windTimer); window.clearTimeout(gardenWindTimer); if (roomAudio && roomAudio.state !== 'closed') void roomAudio.close().catch((error) => console.error('Unable to close Herb Room sound.', error)); });
    loadPublishedBook(); updateRoom(); windTimer = window.setTimeout(windEvent, 2500);
  </script>
