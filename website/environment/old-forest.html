<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Forest | Threshold</title>
  <style>
    :root {
      color: #e5ead1;
      background: #11180f;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #304728 0, #182315 42%, #11180f 100%);
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      padding: 3rem 0;
    }

    .chamber {
      border-left: 1px solid #9eb87d;
      padding: 1.5rem 2rem;
    }

    .kind {
      margin: 0 0 0.75rem;
      color: #b9ce92;
      font: 0.72rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
    }

    #chamber-lore {
      max-width: 38rem;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    a {
      color: #d9e9b8;
    }
  </style>
</head>
<body data-branch="old-forest">
  <main>
    <section class="chamber" aria-labelledby="chamber-title">
      <p class="kind" id="chamber-pulse">biome</p>
      <h1 id="chamber-title">Old Forest</h1>
      <p id="chamber-lore"></p>
      <a href="/environment/basin.html">Return to the Basin</a>
    </section>
  </main>
  <script src="/scripts/chamber-loader.js"></script>
</body>
</html>
