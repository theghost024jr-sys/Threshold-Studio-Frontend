<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Forest | Threshold</title>
  <style>
    :root {
      color: #e5ead1;
      background: #11180f;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #304728 0, #182315 42%, #11180f 100%);
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      padding: 3rem 0;
    }

    .chamber {
      border-left: 1px solid #9eb87d;
      padding: 1.5rem 2rem;
    }

    .kind {
      margin: 0 0 0.75rem;
      color: #b9ce92;
      font: 0.72rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
    }

    #chamber-lore {
      max-width: 38rem;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    a {
      color: #d9e9b8;
    }

    .forest-routes {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .forest-routes a {
      border-bottom: 1px solid rgba(185, 206, 146, 0.6);
      padding-bottom: 0.35rem;
      text-decoration: none;
    }

    .forest-routes a:hover,
    .forest-routes a:focus-visible {
      color: #f0f7d8;
      outline: 2px solid #d9e9b8;
      outline-offset: 4px;
    }
  </style>
</head>
<body data-branch="old-forest">
  <main>
    <section class="chamber" aria-labelledby="chamber-title">
      <p class="kind" id="chamber-pulse">biome</p>
      <h1 id="chamber-title">Old Forest</h1>
      <p id="chamber-lore"></p>
      <nav class="forest-routes" aria-label="Old Forest routes">
        <a href="/environment/basin.html">Return to the Basin</a>
        <a href="/portal/cabin-of-moss">Follow the moss-lit way to Cabin of Moss</a>
      </nav>
    </section>
  </main>
  <script src="/scripts/chamber-loader.js"></script>
  <script type="module" src="/scripts/canonical-path.js"></script>
</body>
</html>
