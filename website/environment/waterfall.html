<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Waterfall</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #101b1a;
      color: #f2eee0;
      font-family: Georgia, serif;
    }

    .terrain-image {
      position: absolute;
      pointer-events: none;
    }

    .terrain-image {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    header {
      position: absolute;
      top: clamp(1.2rem, 5vh, 3.5rem);
      left: 50%;
      z-index: 3;
      text-align: center;
      text-shadow: 0 2px 20px rgba(5, 12, 11, 0.9);
      transform: translateX(-50%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-weight: 400;
      letter-spacing: 0;
    }

    .return-north {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 4;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(242, 238, 224, 0.64);
      background: rgba(8, 14, 13, 0.72);
      color: inherit;
      font: 600 0.85rem/1 sans-serif;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .return-north {
        top: auto;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <img class="terrain-image" src="/assets/images/Waterfall.jpg" alt="" aria-hidden="true" />
  <header>
    <h1>The Waterfall</h1>
  </header>
  <a class="return-north" href="/environment/herbroom.html">Return North</a>
</body>
</html>
