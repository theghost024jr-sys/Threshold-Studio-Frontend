<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Archive - Threshold Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles/glyphs.css" />
  <link rel="stylesheet" href="styles/spoke-tabs.css" />
  <link rel="stylesheet" href="styles/complexity-layers.css" />
</head>
<body class="glyphs-page" data-threshold-spoke="glyphs" data-complexity="foundation atmosphere topology interaction" data-motion="bounded">
  <header class="glyph-site-header">
    <a class="glyph-brand" href="index.html" aria-label="Threshold Hub">
      <span class="glyph-brand-mark" aria-hidden="true">T</span>
      <span>Threshold Studio</span>
    </a>
    <nav class="glyph-site-nav" aria-label="Archive navigation">
      <a href="index.html">Hub</a>
      <a href="ethos.html">Ethos</a>
      <a href="invitation.html">Invitation</a>
    </nav>
  </header>

  <main class="glyph-page-shell">
    <header class="archive-heading">
      <p class="archive-eyebrow">A living branch of the world</p>
      <h1>Glyph Archive</h1>
      <p class="archive-intro">The Archive is not a shelf. It is a descent. Choose a path and let the chamber answer.</p>
    </header>

    <section id="archive" data-weather="threshold" aria-label="Glyph Archive descent">
      <div class="archive-weather" aria-hidden="true">
        <div id="weather-fog"></div>
        <div id="weather-shimmer"></div>
        <div id="weather-storm"></div>
        <div id="weather-soil"></div>
      </div>
      <div id="cave" aria-hidden="true">
        <span class="cave-wall cave-wall-left"></span>
        <span class="cave-wall cave-wall-right"></span>
        <span class="cave-roof"></span>
        <span class="cave-aperture"></span>
        <span class="archive-sigil">◇</span>
      </div>
      <div id="paths" role="group" aria-label="Choose an archive path">
        <button class="path" type="button" data-choice="collapse" aria-pressed="false" onclick="activateGlyphEngine('collapse')"><span>01</span>Collapse</button>
        <button class="path" type="button" data-choice="expand" aria-pressed="false" onclick="activateGlyphEngine('expand')"><span>02</span>Expand</button>
        <button class="path" type="button" data-choice="fog" aria-pressed="false" onclick="activateGlyphEngine('fog')"><span>03</span>Fog</button>
        <button class="path" type="button" data-choice="soil" aria-pressed="false" onclick="activateGlyphEngine('soil')"><span>04</span>Soil</button>
      </div>
      <div class="archive-reading">
        <p id="archiveStatus" class="archive-status" role="status">Stand at the threshold. Four paths are listening.</p>
        <p id="archiveTrail" class="archive-trail">Maze depth 0</p>
      </div>
      <div id="chamber" aria-live="polite"></div>
      <div style="margin-top:1.2rem;">
        <button type="button" id="glyph-core-btn" aria-label="Reveal glyph core" onclick="activateGlyphEngine('core')">&#9671; Reveal Glyph Core</button>
        <img id="glyph-core-viewer" alt="Glyph core" loading="lazy" style="display:none;max-width:100%;border-radius:12px;margin-top:0.8rem;" />
      </div>

      <section id="glyph-engine" aria-label="Glyph Engine">
        <h3 id="glyph-name" class="glyph-engine-name"></h3>
        <img id="glyph-image" alt="Active glyph" />
        <button type="button" id="glyph-next-btn" class="path glyph-next-btn" onclick="nextGlyphVariant()" style="display:none;">Next Variant</button>
      </section>
    </section>
  </main>

  <footer class="glyph-footer">
    <span>Threshold Studio</span>
    <span>The world is revealed by walking.</span>
  </footer>

  <script src="scripts/node-runtime.js" data-manifest="config/spokes.json"></script>
  <script src="scripts/spoke-tabs.js"></script>
  <script src="scripts/glyphs.js"></script>
  <script type="module" src="scripts/destination-page.js"></script>
  <script>
    (function () {
      var glyphBtn = document.getElementById("glyph-core-btn");
      var glyphViewer = document.getElementById("glyph-core-viewer");
      if (glyphBtn && glyphViewer) {
        glyphBtn.addEventListener("click", function () {
          glyphViewer.src = "../vault/glyphs/glyph-core.png";
          glyphViewer.style.display = "block";
          glyphBtn.style.display = "none";
        });
      }
    })();
  </script>
  <script>
    var glyphVariants = {
      collapse: [
        "vault/glyphs/collapse/variant1.png",
        "vault/glyphs/collapse/variant2.png",
        "vault/glyphs/collapse/variant3.png"
      ],
      expand: [
        "vault/glyphs/expand/variant1.png",
        "vault/glyphs/expand/variant2.png"
      ],
      fog: [
        "vault/glyphs/fog/variant1.png",
        "vault/glyphs/fog/variant2.png"
      ],
      soil: [
        "vault/glyphs/soil/variant1.png",
        "vault/glyphs/soil/variant2.png"
      ],
      core: [
        "vault/glyphs/core/variant1.png"
      ]
    };

    var currentGlyph = null;
    var currentGlyphVariant = 0;

    function activateGlyphEngine(glyph) {
      var viewer = document.getElementById("glyph-engine");
      var img = document.getElementById("glyph-image");
      var name = document.getElementById("glyph-name");
      var nextBtn = document.getElementById("glyph-next-btn");

      currentGlyph = glyph;
      currentGlyphVariant = 0;

      viewer.classList.add("revealed", "breathe");
      img.src = glyphVariants[glyph][currentGlyphVariant];
      name.innerText = glyph.toUpperCase();

      if (nextBtn && glyphVariants[glyph].length > 1) {
        nextBtn.style.display = "";
      } else if (nextBtn) {
        nextBtn.style.display = "none";
      }
    }

    function nextGlyphVariant() {
      if (!currentGlyph || !glyphVariants[currentGlyph]) return;
      var img = document.getElementById("glyph-image");
      currentGlyphVariant = (currentGlyphVariant + 1) % glyphVariants[currentGlyph].length;
      img.src = glyphVariants[currentGlyph][currentGlyphVariant];
    }
  </script>
</body>
</html>
