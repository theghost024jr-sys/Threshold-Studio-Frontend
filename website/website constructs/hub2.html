<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="stylesheet" href="hub2.css">
</head>

<body>

  <!-- HUB -->
  <div class="hub">

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Blue inner ring -->
    <div class="inner-ring"></div>

    <!-- Elliptical orbits -->
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>
    <div class="orbit o4"></div>

    <!-- Planets -->
    <div class="p1w">
      <div class="planet p1"></div>
    </div>

    <div class="p2w">
      <div class="planet p2"></div>
    </div>

    <div class="p3w">
      <div class="planet p3"></div>
    </div>

    <div class="p4w">
      <div class="planet p4"></div>
    </div>

    <!-- Pulse -->
    <div class="pulse"></div>

    <!-- Moon -->
    <div class="moon-wrapper">
      <div class="moon"></div>
    </div>

    <!-- Comet -->
    <div class="comet-wrapper">
      <div class="comet"></div>
    </div>

  </div> <!-- END .hub -->

  <script src="hub2.js"></script>
</body>
</html>
